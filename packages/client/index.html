<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1.0, user-scalable=no: the table layout never needs native pinch-zoom, and
         leaving it enabled means a two-finger touch anywhere (playing a card, opening a modal)
         can accidentally trigger the BROWSER's own page zoom/pan instead of the intended tap —
         same fix already in place on Worldly/Outworldly/Mexican Train. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠️</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
